      prompt_to_image: "Great! Now please provide a prompt for the image. It can later be extended with the help of the bot."
      prompt_to_audio: "Great! Now please provide a prompt for the audio."
      image_to_video: |
        Great! Now please send me the image you want to turn into a video.
        It can be sent as:

        🔹 a URL 🔗 (you can copy one from previous messages if needed)
        🔹 a picture 🖼
        🔹 a file 📁

        Please note that the image must be at least 300x300 pixels and smaller than 10 MB.
      first_last_frame_to_video: |
        Great! Send the first image (start frame), then the second image (end frame).
        Each can be sent as:

        🔹 a URL 🔗
        🔹 a picture 🖼
        🔹 a file 📁

        Please note that each image must be at least 300x300 pixels and smaller than 10 MB.
        After both images are received, you can optionally provide a prompt and generate video with Kling 3 Standard.
      edit_image: |
        Great! Send the image you want to edit.
        It can be sent as:

        🔹 a URL 🔗
        🔹 a picture 🖼
        🔹 a file 📁

        Please note that the image must be at least 300x300 pixels and smaller than 10 MB.
      prompt_policy: |
        Prompt policy 🛡

        ♦️ Do not request sexual content.

        ♦️ Do not request graphic violence, self-harm, or dangerous wrongdoing.

        ♦️ Do not request hateful or harassing content.
