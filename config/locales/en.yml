          👋 Hi! Great to see you here.

          🎉 As one of our first users, you've received 100 free stones 🪨 to try out the bot!
        no_token: |
          👋 Hi! Great to see you here.

          🤖 With this bot, you can generate images, videos, and audio using different AI models.

          🎨 To generate an image, type:
          /prompt_to_image

          🔊 To generate audio, type:
          /prompt_to_audio

          🎬 To generate a video, type:
          /prompt_to_video

          🖼🎬 To turn a picture into a video, type:
          /image_to_video

          🖼🎬 To turn a start & end frame into a video, type:
          /first_last_frame_to_video

          🖼✏️ To edit an image, type:
          /edit_image

          💰 To check your balance, type:
          /balance

          🔑 To activate a token, type:
          /activate_token

          ⭐ To buy stones 🪨 with Telegram Stars, type:
          /buy_stones

          🌐 To set your language, type:
          /set_locale

          🛡 To view the prompt policy rules, type:
          /prompt_policy

          📩 To contact support, type:
          /contact_support

          ℹ️ Each generation costs stones 🪨.
          To top up your balance, either use /activate_token and enter a valid token, or use /buy_stones to purchase stones with Telegram Stars.
