      help: |
        🤖 With this bot, you can generate images, videos, and audio using different AI models.

        🎨 To generate an image, type:
        /prompt_to_image

        🔊 To generate audio, type:
        /prompt_to_audio

        🎬 To generate a video, type:
        /prompt_to_video

        🖼🎬 To turn a picture into a video, type:
        /image_to_video

        🖼🎬 To turn a start & end frame into a video, type:
        /first_last_frame_to_video

        🖼✏️ To edit an image, type:
        /edit_image

        💰 To check your balance, type:
        /balance

        🔑 To activate a token, type:
        /activate_token

        ⭐ To buy stones 🪨 with Telegram Stars, type:
        /buy_stones

        🌐 To set your language, type:
        /set_locale

        🛡 To view the prompt policy rules, type:
        /prompt_policy

        📩 To contact support, type:
        /contact_support

        ℹ️ Each generation costs stones 🪨.
        To top up your balance, either use /activate_token and enter a valid token, or use /buy_stones to purchase stones with Telegram Stars.
      admin: |
        Here are the possible commands for admin:

        🔹 /generate_random_cats_script - will generate random script

        🔹 /motivation_workflow_en - motivation script, audio, and cinematic video prompts (English)

        🔹 /motivation_workflow_pl - motivation script, audio, and cinematic video prompts (Polish)

        🔹 /motivation_workflow_ru - motivation script, audio, and cinematic video prompts (Russian)

        🔹 /generate_cats_script %template_name% - will generate script from template_name param

        🔹 /cats_script_templates - see possible script templates

        🔹 /food_character - generate a random character image

        🔹 /brainrot_character - generate a random brainrot character image

        🔹 /cartoon_character - generate a random preschool cartoon character image

        🔹 /bloomy_multiscene_cartoon_yt - generate 12 cartoon scenes

        🔹 /bloomy_cartoon_short - generate 1 cartoon scene for shorts (9:16)

        🔹 /bloomy_complex_short - generate 5 chained cartoon shorts scenes (9:16)
      food_character: "Started random character generation."
      brainrot_character: "Started brainrot character generation."
      cartoon_character: "Started cartoon character generation."
      bloomy_multiscene_cartoon_yt: "Started cartoon script generation."
      bloomy_cartoon_short: "Started cartoon shorts script generation."
      bloomy_complex_short: "Started complex cartoon shorts script generation."
      motivation_workflow: "Started motivation workflow: script, audio, and video prompts."
